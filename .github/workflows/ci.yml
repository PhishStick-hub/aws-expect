name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_ci.yml
    with:
      run-build: ${{ github.event_name == 'pull_request' }}
      skip-integration-tests: ${{ startsWith(github.head_ref, 'release-please--') }}
